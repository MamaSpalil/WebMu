<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2K MuOnline — Legendary Server</title>
    <meta name="description" content="A2K MuOnline — official intro page. Join the legendary fantasy MMORPG MuOnline private server.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <style>
        :root {
            --gold-light: #fff0a8;
            --gold: #e6c34a;
            --gold-dark: #a87a18;
            --gold-deep: #5a3d05;
            --bg-deep: #050301;
            --bg-panel: rgba(14, 9, 3, 0.78);
            --bg-panel-2: rgba(28, 18, 6, 0.85);
            --border-gold: rgba(202, 160, 64, 0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100vh;
            background: var(--bg-deep);
            color: var(--gold-light);
            font-family: 'Cinzel', 'Times New Roman', serif;
            overflow-x: hidden;
        }

        body {
            background:
                url('assets/images/background.svg') center top / cover no-repeat fixed,
                radial-gradient(ellipse at top, #2a1a08 0%, #0a0602 70%, #000 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.7) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.05) 3px);
            pointer-events: none;
            z-index: 1;
        }

        /* ========== HEADER / NAV ========== */
        .site-header {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(20,12,4,0.95) 0%, rgba(10,6,2,0.85) 100%);
            border-bottom: 2px solid var(--gold-dark);
            box-shadow: 0 4px 20px rgba(202, 160, 64, 0.2),
                        inset 0 -1px 0 rgba(255, 240, 168, 0.15);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .brand img {
            height: 56px;
            filter: drop-shadow(0 2px 6px rgba(202,160,64,0.6));
        }

        .brand-text {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-size: 22px;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(202,160,64,0.3);
        }

        .main-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .nav-btn {
            position: relative;
            display: inline-block;
            padding: 12px 26px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--gold-light);
            background: linear-gradient(180deg, #2a1d08 0%, #14100a 100%);
            border: 1px solid var(--border-gold);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow:
                inset 0 1px 0 rgba(255, 240, 168, 0.15),
                inset 0 -1px 0 rgba(0,0,0,0.4),
                0 2px 6px rgba(0,0,0,0.5);
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1px solid rgba(202, 160, 64, 0.15);
            pointer-events: none;
        }

        .nav-btn:hover {
            color: #fff;
            background: linear-gradient(180deg, #4a3210 0%, #2a1d08 100%);
            border-color: var(--gold);
            box-shadow:
                inset 0 1px 0 rgba(255, 240, 168, 0.3),
                0 0 18px rgba(202, 160, 64, 0.55),
                0 2px 6px rgba(0,0,0,0.6);
            transform: translateY(-1px);
        }

        /* ========== HERO ========== */
        .hero {
            position: relative;
            z-index: 5;
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 30px 40px;
            text-align: center;
        }

        .ornament {
            display: block;
            max-width: 540px;
            margin: 0 auto 18px;
            filter: drop-shadow(0 2px 8px rgba(202,160,64,0.45));
        }

        .hero-title {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-size: clamp(40px, 7vw, 84px);
            line-height: 1.05;
            background: linear-gradient(180deg,
                #fff5b8 0%,
                var(--gold) 35%,
                var(--gold-dark) 65%,
                var(--gold-deep) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 6px;
            text-shadow:
                0 0 24px rgba(202, 160, 64, 0.45),
                0 4px 0 rgba(0,0,0,0.6);
            margin-bottom: 8px;
        }

        .hero-subtitle {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            font-size: clamp(14px, 1.6vw, 18px);
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.9;
            margin-bottom: 36px;
        }

        /* ========== ACTION BUTTONS ========== */
        .actions {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 40px 0 60px;
        }

        .btn-major {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 260px;
            padding: 28px 60px;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-size: 36px;
            letter-spacing: 10px;
            text-transform: uppercase;
            text-decoration: none;
            color: #fff5b8;
            background:
                linear-gradient(180deg,
                    #6a4a12 0%,
                    #3a280a 45%,
                    #1a1206 100%);
            border: 2px solid var(--gold);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow:
                0 0 12px rgba(202,160,64,0.7),
                0 2px 0 rgba(0,0,0,0.8);
            box-shadow:
                inset 0 2px 0 rgba(255, 240, 168, 0.35),
                inset 0 -3px 0 rgba(0,0,0,0.6),
                inset 0 0 30px rgba(202,160,64,0.2),
                0 6px 18px rgba(0,0,0,0.7),
                0 0 24px rgba(202, 160, 64, 0.25);
        }

        .btn-major::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(255, 240, 168, 0.3);
            border-radius: 2px;
            pointer-events: none;
        }

        .btn-major::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, transparent 30%, rgba(255,240,168,0.15) 50%, transparent 70%);
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .btn-major:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: #fff5b8;
            color: #fff;
            background:
                linear-gradient(180deg,
                    #8a6018 0%,
                    #4a320e 45%,
                    #261806 100%);
            box-shadow:
                inset 0 2px 0 rgba(255, 240, 168, 0.5),
                inset 0 -3px 0 rgba(0,0,0,0.6),
                inset 0 0 40px rgba(202,160,64,0.4),
                0 10px 28px rgba(0,0,0,0.8),
                0 0 40px rgba(230, 195, 74, 0.6);
        }

        .btn-major:hover::after { opacity: 1; }

        .btn-major:active { transform: translateY(-1px) scale(1.0); }

        .btn-major .icon {
            margin-right: 14px;
            font-size: 0.7em;
            opacity: 0.85;
        }

        /* ========== VIDEO PANEL ========== */
        .video-section {
            position: relative;
            z-index: 5;
            max-width: 980px;
            margin: 0 auto 80px;
            padding: 0 20px;
        }

        .panel-title {
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            font-size: clamp(22px, 3.2vw, 34px);
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 22px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .video-frame {
            position: relative;
            background: var(--bg-panel-2);
            padding: 18px;
            border: 2px solid var(--gold-dark);
            border-radius: 6px;
            box-shadow:
                inset 0 0 30px rgba(0,0,0,0.7),
                0 0 0 1px rgba(255, 240, 168, 0.08),
                0 10px 40px rgba(0,0,0,0.8),
                0 0 30px rgba(202, 160, 64, 0.15);
        }

        .video-frame::before,
        .video-frame::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            border: 2px solid var(--gold);
            opacity: 0.85;
        }

        .video-frame::before {
            top: -6px; left: -6px;
            border-right: none; border-bottom: none;
        }

        .video-frame::after {
            bottom: -6px; right: -6px;
            border-left: none; border-top: none;
        }

        .video-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid var(--border-gold);
            overflow: hidden;
        }

        .video-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-caption {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.8;
            margin-top: 14px;
        }

        /* ========== HEROES STRIP ========== */
        .heroes {
            position: relative;
            z-index: 4;
            max-width: 1280px;
            margin: 0 auto 60px;
            padding: 0 30px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 60px;
            opacity: 0.9;
        }

        .heroes img {
            width: clamp(140px, 16vw, 240px);
            filter:
                drop-shadow(0 8px 20px rgba(0,0,0,0.85))
                drop-shadow(0 0 18px rgba(202,160,64,0.35));
            transition: transform 0.4s ease, filter 0.4s ease;
        }

        .heroes img:hover {
            transform: translateY(-8px);
            filter:
                drop-shadow(0 12px 28px rgba(0,0,0,0.9))
                drop-shadow(0 0 28px rgba(230,195,74,0.6));
        }

        /* ========== FOOTER ========== */
        .site-footer {
            position: relative;
            z-index: 5;
            margin-top: 40px;
            padding: 24px 20px;
            text-align: center;
            background: linear-gradient(180deg, transparent 0%, rgba(10,6,2,0.9) 60%);
            border-top: 1px solid var(--border-gold);
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold-dark);
        }

        .site-footer span { color: var(--gold); }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 720px) {
            .nav-container { justify-content: center; padding: 12px 16px; }
            .brand-text { font-size: 18px; letter-spacing: 2px; }
            .nav-btn { padding: 10px 16px; font-size: 12px; letter-spacing: 2px; }
            .actions { gap: 22px; margin: 30px 0 40px; }
            .btn-major { min-width: 220px; padding: 22px 36px; font-size: 28px; letter-spacing: 6px; }
            .heroes { gap: 20px; }
        }
    </style>
</head>
<body>

    <!-- ============== HEADER / NAVIGATION ============== -->
    <header class="site-header">
        <div class="nav-container">
            <a class="brand" href="#">
                <img src="assets/images/logo.svg" alt="A2K MuOnline">
                <span class="brand-text">A2K&nbsp;MuOnline</span>
            </a>
            <nav class="main-nav" aria-label="Primary">
                <a class="nav-btn" href="#download">Download</a>
                <a class="nav-btn" href="#ranking">Ranking</a>
                <a class="nav-btn" href="#registration">Registration</a>
                <a class="nav-btn" href="#about">About</a>
            </nav>
        </div>
    </header>

    <!-- ============== HERO ============== -->
    <section class="hero">
        <img class="ornament" src="assets/images/ornament.svg" alt="">
        <h1 class="hero-title">A2K MuOnline</h1>
        <p class="hero-subtitle">— Legend of the Continent —</p>

        <div class="actions">
            <a class="btn-major" href="#join">
                <span class="icon" aria-hidden="true">⚔</span>JOIN
            </a>
            <a class="btn-major" href="#forum">
                <span class="icon" aria-hidden="true">📜</span>FORUM
            </a>
        </div>
    </section>

    <!-- ============== VIDEO ============== -->
    <section class="video-section" id="trailer">
        <h2 class="panel-title">Season 3 Episode 1</h2>
        <div class="video-frame">
            <div class="video-wrap">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/QMpQfq3cec0?rel=0&modestbranding=1"
                    title="MU Online — Season 3 Episode 1 trailer"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </div>
            <p class="video-caption">MU Online — Season 3 Episode 1 Trailer</p>
        </div>
    </section>

    <!-- ============== HEROES ============== -->
    <section class="heroes" aria-hidden="true">
        <img src="assets/images/knight.svg" alt="Dark Knight">
        <img src="assets/images/wizard.svg" alt="Dark Wizard">
    </section>

    <!-- ============== FOOTER ============== -->
    <footer class="site-footer">
        © A2K <span>MuOnline</span> — Forge your legend in the eternal continent
    </footer>

</body>
</html>
