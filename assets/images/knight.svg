<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a10"/>
      <stop offset="50%" stop-color="#1a1206"/>
      <stop offset="100%" stop-color="#0a0703"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe88a"/>
      <stop offset="100%" stop-color="#a87a18"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#caa040" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#caa040" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- aura -->
  <ellipse cx="200" cy="540" rx="170" ry="40" fill="url(#aura)"/>
  <!-- cape -->
  <path d="M120,200 C90,300 80,420 100,540 L300,540 C320,420 310,300 280,200 Z"
        fill="#2a0f0a" opacity="0.85"/>
  <!-- body armor -->
  <path d="M150,200 L250,200 L270,290 L260,420 L230,540 L170,540 L140,420 L130,290 Z"
        fill="url(#armor)" stroke="url(#goldEdge)" stroke-width="2"/>
  <!-- chest emblem -->
  <circle cx="200" cy="290" r="20" fill="none" stroke="url(#goldEdge)" stroke-width="2"/>
  <path d="M200,275 L210,295 L195,310 L185,290 Z" fill="url(#goldEdge)"/>
  <!-- belt -->
  <rect x="140" y="380" width="120" height="14" fill="url(#goldEdge)"/>
  <rect x="190" y="378" width="20" height="20" fill="#3a2a10" stroke="url(#goldEdge)"/>
  <!-- shoulders -->
  <path d="M120,210 C100,215 95,260 130,270 L155,250 Z" fill="url(#armor)" stroke="url(#goldEdge)" stroke-width="1.5"/>
  <path d="M280,210 C300,215 305,260 270,270 L245,250 Z" fill="url(#armor)" stroke="url(#goldEdge)" stroke-width="1.5"/>
  <!-- helmet -->
  <path d="M165,90 C165,55 235,55 235,90 L240,170 C240,195 160,195 160,170 Z"
        fill="url(#armor)" stroke="url(#goldEdge)" stroke-width="2"/>
  <!-- helmet visor slit -->
  <rect x="175" y="120" width="50" height="6" fill="#000"/>
  <rect x="175" y="135" width="50" height="6" fill="#000"/>
  <!-- helmet crest -->
  <path d="M195,55 L200,30 L205,55 Z" fill="url(#goldEdge)"/>
  <path d="M180,60 C190,40 210,40 220,60 L215,80 L185,80 Z" fill="url(#goldEdge)" opacity="0.8"/>
  <!-- sword -->
  <g transform="translate(80,200) rotate(-15)">
    <rect x="-4" y="-180" width="8" height="260" fill="url(#goldEdge)"/>
    <rect x="-30" y="80" width="60" height="10" fill="url(#goldEdge)"/>
    <rect x="-6" y="90" width="12" height="40" fill="#3a2a10"/>
    <circle cx="0" cy="135" r="8" fill="url(#goldEdge)"/>
    <polygon points="-4,-180 0,-200 4,-180" fill="url(#goldEdge)"/>
  </g>
  <!-- shield -->
  <g transform="translate(330,290)">
    <path d="M0,-50 L40,-30 L40,30 C40,60 0,80 0,80 C0,80 -40,60 -40,30 L-40,-30 Z"
          fill="url(#armor)" stroke="url(#goldEdge)" stroke-width="2"/>
    <path d="M0,-30 L20,-20 L20,20 C20,40 0,55 0,55 C0,55 -20,40 -20,20 L-20,-20 Z"
          fill="none" stroke="url(#goldEdge)" stroke-width="1.5"/>
    <path d="M-6,-10 L0,15 L6,-10 L0,-15 Z" fill="url(#goldEdge)"/>
  </g>
</svg>
